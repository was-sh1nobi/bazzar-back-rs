[package]
name = "bazzar-back"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
dotenvy = "0.15.7"
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = {version = "2.0.2" , features = ["sqlx-postgres" , "runtime-tokio-rustls" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
argon2 = { version = "0.5.3", features = ["std"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
uuid = { version = "1.12", features = ["v4"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
